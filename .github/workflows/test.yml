name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run downloader tests
        run: python -m unittest discover -v

      - name: Build and smoke-test the container
        run: |
          docker build --file docker/Dockerfile --tag scryfall-downloader:pr .
          bash docker/smoke.sh scryfall-downloader:pr
          DEFAULT_PORT=18765 bash docker/smoke.sh scryfall-downloader:pr
