name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to release (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "$TAG" == latest ]] ||
             ! git check-ref-format "refs/tags/$TAG"; then
            echo '::error::Supply an existing Git tag usable as a versioned container tag (e.g. v1.0.0).'
            exit 1
          fi

      - name: Checkout the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a tag on the default branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD "$GITHUB_SHA"; then
            echo '::error::The tag must point to a commit in the default branch history.'
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run downloader tests
        run: python -m unittest -v test_downloader

      - name: Build and smoke-test the container
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$TAG" .
          container=$(docker run -d -p 127.0.0.1::8765 "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          address=$(docker port "$container" 8765/tcp)
          if ! curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 \
            --max-time 5 "http://$address/jobs" | jq -e '.jobs == []'; then
            docker logs "$container"
            exit 1
          fi

      - name: Publish container and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          if [[ "$remote_tag" != "$(git rev-parse "refs/tags/$TAG")" ]]; then
            echo '::error::The tag moved after checkout. Start a new run from the intended tag.'
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::A GitHub release already exists for this tag. Choose a new tag.'
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "Container image (linux/amd64): \`$IMAGE\`"
